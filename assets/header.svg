<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Deniz — Building what's next.</title>
  <desc id="desc">An animated dark futuristic banner with a moving grid, rotating turquoise orbits and cycling taglines.</desc>
  <style>
    .spin { transform-origin: 770px 160px; animation: spin 24s linear infinite; }
    .spin-rev { transform-origin: 770px 160px; animation: spin 36s linear infinite reverse; }
    .grid { animation: drift 6s linear infinite; }
    .scan { animation: scan 5s ease-in-out infinite; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
    .blink { animation: blink 1s steps(1) infinite; }
    .tag { opacity: 0; animation: cycle 12s infinite; }
    .t2 { animation-delay: 4s; }
    .t3 { animation-delay: 8s; }
    .glitch { animation: glitch 7s infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes drift { to { transform: translateY(40px); } }
    @keyframes scan { 0%, 100% { transform: translateY(-20px); opacity: 0; } 10%, 90% { opacity: 1; } 50% { transform: translateY(330px); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(2.2); opacity: 0.3; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes cycle { 0% { opacity: 0; transform: translateX(-8px); } 4%, 30% { opacity: 1; transform: none; } 34%, 100% { opacity: 0; } }
    @keyframes glitch { 0%, 92%, 100% { transform: none; } 93% { transform: translate(3px, -1px); } 95% { transform: translate(-3px, 1px); } 97% { transform: translate(1px, 0); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .tag.t1 { opacity: 1; } }
  </style>
  <defs>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.65">
      <stop stop-color="#123635"/>
      <stop offset="1" stop-color="#0D1117"/>
    </radialGradient>
    <linearGradient id="orbit" x1="590" y1="60" x2="900" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#65E4CF" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#65E4CF" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#65E4CF" stop-opacity="0"/>
      <stop offset="1" stop-color="#65E4CF" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="cells" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" stroke="#65E4CF" stroke-opacity="0.07"/>
    </pattern>
    <mask id="gridMask"><rect width="960" height="320" fill="url(#fade)"/></mask>
    <clipPath id="frame"><rect width="960" height="320" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="960" height="320" fill="#0D1117"/>
    <rect width="960" height="320" fill="url(#glow)"/>
    <g mask="url(#gridMask)"><rect class="grid" y="-40" width="960" height="400" fill="url(#cells)"/></g>
    <rect class="scan" width="960" height="24" fill="url(#beam)"/>

    <g stroke="url(#orbit)" stroke-width="1">
      <circle cx="770" cy="160" r="99" stroke-dasharray="4 8" class="spin"/>
      <circle cx="770" cy="160" r="135" class="spin-rev"/>
      <circle cx="770" cy="160" r="173" stroke-dasharray="1 6" class="spin"/>
      <g class="spin-rev"><ellipse cx="770" cy="160" rx="194" ry="48" transform="rotate(-35 770 160)"/></g>
    </g>
    <g class="spin"><circle cx="770" cy="61" r="4" fill="#8CF4DE"/></g>
    <g class="spin-rev"><circle cx="905" cy="160" r="3" fill="#65E4CF"/></g>
    <path d="M754 160h32m-16-16v32" stroke="#65E4CF" stroke-opacity="0.7"/>
    <circle cx="770" cy="160" r="5" fill="#65E4CF" class="pulse"/>

    <path d="M48 46h24M48 46v24M912 274h-24M912 274v-24" stroke="#65E4CF" stroke-opacity="0.45"/>
    <text x="64" y="80" fill="#65E4CF" fill-opacity="0.6" font-family="'SFMono-Regular', Consolas, monospace" font-size="13" letter-spacing="2">// SYSTEM ONLINE</text>
    <g class="glitch">
      <text x="64" y="154" fill="#F0F6FC" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="600" letter-spacing="-3">Deniz<tspan fill="#65E4CF">.</tspan></text>
    </g>
    <g font-family="'SFMono-Regular', Consolas, monospace" font-size="22" fill="#ACB9C3">
      <text x="67" y="199" class="tag t1"><tspan fill="#65E4CF">&gt; </tspan>Building what's next.</text>
      <text x="67" y="199" class="tag t2"><tspan fill="#65E4CF">&gt; </tspan>AI tools · Automation.</text>
      <text x="67" y="199" class="tag t3"><tspan fill="#65E4CF">&gt; </tspan>Code that works while I sleep.</text>
    </g>
    <rect x="67" y="226" width="12" height="3" fill="#65E4CF" class="blink"/>
  </g>
</svg>
