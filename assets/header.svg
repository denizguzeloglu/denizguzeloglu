    <text x="64" y="154" fill="#F0F6FC" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="600" letter-spacing="-3">Deniz<tspan fill="#65E4CF">.</tspan></text>
    <text x="67" y="199" fill="#ACB9C3" font-family="Arial, Helvetica, sans-serif" font-size="24">Building what's next.</text>
    <path d="M67 235h40" stroke="#65E4CF" stroke-width="2"/>
