    </radialGradient>
    <linearGradient id="orbit" x1="590" y1="60" x2="900" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#65E4CF" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#65E4CF" stop-opacity="0.04"/>
    </linearGradient>
    <clipPath id="frame"><rect width="960" height="320" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
